# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0       # Scale to 0 when idle to eliminate idle compute costs
  maxInstances: 2       # Cap maximum instances to prevent bill shock
  concurrency: 80       # Multiplex concurrent requests per instance
  cpu: 1                # Standard 1 vCPU allocation
  memoryMiB: 512        # 512 MiB memory limit
